[project]
name = "trade-assist-backend"
version = "0.1.0"
description = "Agentic AI trading tutor — backend (agent brain, paper engine, data, API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "anthropic>=0.40",
    "litellm>=1.40",
    "arq>=0.26",
    "structlog>=24.1",
    "yfinance>=0.2.40",
    # Forecast lens (TimesFM). Heavy: pulls PyTorch and downloads ~800 MB of
    # weights on first use. Loaded lazily and used strictly on demand — the
    # app degrades gracefully (a clean 503) if it isn't importable.
    "timesfm[torch]>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these callables in argument defaults by design.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]
